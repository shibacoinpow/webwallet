        <script>
            // Comprehensive patch to allow large UTXO values (for coins with >21M supply like SHIC)
            (function() {
                if (typeof bitcoin === 'undefined') return;

                // 1. Patch Transaction.addOutput to bypass Satoshi validation
                if (bitcoin.Transaction && bitcoin.Transaction.prototype.addOutput) {
                    bitcoin.Transaction.prototype.addOutput = function(scriptPubKey, value) {
                        // Directly add to outs array without type validation
                        this.outs.push({
                            script: scriptPubKey,
                            value: value
                        });
                        return this.outs.length - 1;
                    };
                }

                // 2. Patch TransactionBuilder.addOutput to properly add outputs
                if (bitcoin.TransactionBuilder && bitcoin.TransactionBuilder.prototype.addOutput) {
                    var origTBAddOutput = bitcoin.TransactionBuilder.prototype.addOutput;
                    bitcoin.TransactionBuilder.prototype.addOutput = function(address, value) {
                        try {
                            // Get the script from address
                            var script = bitcoin.address.toOutputScript(address, this.network);

                            // Add to this.outs
                            if (!this.outs) this.outs = [];
                            this.outs.push({ script: script, value: value });

                            // Add to this.__TX (the internal transaction used by the library)
                            if (!this.__TX) {
                                this.__TX = new bitcoin.Transaction();
                                this.__TX.version = 2;
                            }
                            if (!this.__TX.outs) this.__TX.outs = [];
                            this.__TX.outs.push({ script: script, value: value });

                            return this;
                        } catch(e) {
                            // Fall back to original
                            return origTBAddOutput.call(this, address, value);
                        }
                    };
                }

                // 3. Patch TransactionBuilder.sign to bypass witnessValue Satoshi validation
                if (bitcoin.TransactionBuilder && bitcoin.TransactionBuilder.prototype.sign) {
                    var origSign = bitcoin.TransactionBuilder.prototype.sign;
                    bitcoin.TransactionBuilder.prototype.sign = function() {
                        // Try original first
                        try {
                            return origSign.apply(this, arguments);
                        } catch(e) {
                            // If it's a Satoshi validation error, try to work around it
                            if (e.message && (e.message.indexOf('Satoshi') >= 0 ||
                                e.message.indexOf('witnessValue') >= 0)) {
                                // Get the input and set value directly without validation
                                var args = Array.prototype.slice.call(arguments);
                                var signParams = args[0];
                                var vin = typeof signParams === 'number' ? signParams : signParams.vin;

                                if (this.__INPUTS && this.__INPUTS[vin]) {
                                    var input = this.__INPUTS[vin];
                                    // Copy value to input without validation
                                    if (signParams.witnessValue !== undefined) {
                                        input.value = signParams.witnessValue;
                                    }
                                }
                                // Try again
                                return origSign.apply(this, arguments);
                            }
                            throw e;
                        }
                    };
                }

                // 4. Patch Transaction.__toBuffer to serialize output values with
                //    BigInt instead of float math, so values above
                //    Number.MAX_SAFE_INTEGER (~90M SHIC at 8 decimals) no longer
                //    corrupt or throw when signing/serializing. This is the same
                //    method hashForSignature() uses internally, so it fixes both
                //    signing and final tx serialization in one place.
                if (bitcoin.Transaction && bitcoin.Transaction.prototype.__toBuffer) {
                    var ADVANCED_TRANSACTION_MARKER = 0x00;
                    var ADVANCED_TRANSACTION_FLAG = 0x01;

                    var writeVarInt = function(buf, n, offset) {
                        if (n < 0xfd) {
                            buf.writeUInt8(n, offset);
                            return offset + 1;
                        } else if (n <= 0xffff) {
                            buf.writeUInt8(0xfd, offset);
                            buf.writeUInt16LE(n, offset + 1);
                            return offset + 3;
                        } else if (n <= 0xffffffff) {
                            buf.writeUInt8(0xfe, offset);
                            buf.writeUInt32LE(n, offset + 1);
                            return offset + 5;
                        } else {
                            buf.writeUInt8(0xff, offset);
                            var big = BigInt(n);
                            buf.writeUInt32LE(Number(big & 0xffffffffn), offset + 1);
                            buf.writeUInt32LE(Number(big >> 32n), offset + 5);
                            return offset + 9;
                        }
                    };

                    var writeUInt64LEBig = function(buf, value, offset) {
                        var big = typeof value === 'bigint' ? value : BigInt(value);
                        if (big < 0n) throw new Error('specified a negative value for writing an unsigned value');
                        if (big > 0xffffffffffffffffn) throw new Error('RangeError: value out of range');
                        buf.writeUInt32LE(Number(big & 0xffffffffn), offset);
                        buf.writeUInt32LE(Number(big >> 32n), offset + 4);
                        return offset + 8;
                    };

                    bitcoin.Transaction.prototype.__toBuffer = function(buffer, initialOffset, forWitness) {
                        if (forWitness === undefined) forWitness = false;
                        if (!buffer) buffer = bitcoin.Buffer.allocUnsafe(this.byteLength(forWitness));
                        var offset = initialOffset || 0;

                        function writeSlice(slice) { offset += slice.copy(buffer, offset); }
                        function writeUInt8(i) { offset = buffer.writeUInt8(i, offset); }
                        function writeUInt32(i) { offset = buffer.writeUInt32LE(i, offset); }
                        function writeVarInt_(i) { offset = writeVarInt(buffer, i, offset); }
                        function writeVarSlice(slice) { writeVarInt_(slice.length); writeSlice(slice); }
                        function writeUInt64(i) { offset = writeUInt64LEBig(buffer, i, offset); }

                        offset = buffer.writeInt32LE(this.version, offset);

                        var hasWitnesses = forWitness && this.hasWitnesses();

                        if (hasWitnesses) {
                            writeUInt8(ADVANCED_TRANSACTION_MARKER);
                            writeUInt8(ADVANCED_TRANSACTION_FLAG);
                        }

                        writeVarInt_(this.ins.length);
                        this.ins.forEach(function(txIn) {
                            writeSlice(txIn.hash);
                            writeUInt32(txIn.index);
                            writeVarSlice(txIn.script);
                            writeUInt32(txIn.sequence);
                        });

                        writeVarInt_(this.outs.length);
                        this.outs.forEach(function(txOut) {
                            if (txOut.value !== undefined) {
                                writeUInt64(txOut.value);
                            } else {
                                writeSlice(txOut.valueBuffer);
                            }
                            writeVarSlice(txOut.script);
                        });

                        if (hasWitnesses) {
                            this.ins.forEach(function(input) {
                                var witness = input.witness;
                                writeVarInt_(witness.length);
                                witness.forEach(writeVarSlice);
                            });
                        }

                        writeUInt32(this.locktime);

                        if (initialOffset !== undefined) return buffer.slice(initialOffset, offset);
                        return buffer;
                    };
                }

                // 5. Patch TransactionBuilder.__overMaximumFees, which does
                //    `input.value >>> 0` (silently wraps above ~42.9 coins,
                //    a pre-existing bug independent of the large-UTXO issue)
                //    and mixes that with plain `+` against BigInt output
                //    values, throwing "Cannot mix BigInt and other types"
                //    once outputs exceed Number.MAX_SAFE_INTEGER.
                if (bitcoin.TransactionBuilder && bitcoin.TransactionBuilder.prototype.__overMaximumFees) {
                    bitcoin.TransactionBuilder.prototype.__overMaximumFees = function(bytes) {
                        var inputSum = this.__INPUTS.reduce(function(sum, input) {
                            return sum + BigInt(input.value || 0);
                        }, 0n);
                        var outputSum = this.__TX.outs.reduce(function(sum, out) {
                            return sum + BigInt(out.value);
                        }, 0n);
                        var fee = inputSum - outputSum;
                        return Number(fee) / bytes > this.maximumFeeRate;
                    };
                }

                console.log('Patched library to allow large UTXO values');
            })();

        <style>
        :root {
            --primary-color: #f39c12;
            --primary-hover: #e67e22;
            --bg-dark: #0a1628;
            --bg-card: #0f2744;

        background-attachment: fixed;
        color: var(--text-primary);
        }

        <!-- All magic is here :D -->
        <script>
            // Config
            var walletTimer = false
            var walletVersion = '1.3.0'
            var networkConfigs = {
                'SHIC': {
                    'uri': 'shibacoin:',
                    'title': 'ShibaCoin Wallet',
                    'name': 'Main Network (SHIC)',
                    'api': 'https://electrum.shibacoinshic.org',
                    'ticker': 'SHIC',
                    'decimals': 8,
                    'fee': 0.1,
                    'network': {
                        'messagePrefix': '\x19ShibaCoin Signed Message:\n',
                        'bip32': {
                            'public': 0x02fadafe,
                            'private': 0x02fac495
                        },
                        'bech32': 'shic',
                        'pubKeyHash': 0x3F,
                        'scriptHash': 0x16,
                        'wif': 0x9E
                    }
                }
            }

            // Explorer links
            var blockExplorer = {
                'address': function(address) {
                    return 'https://explorer.shibacoinshic.org/address/' + address
                },
                'tx': function(tx) {
                    return 'https://explorer.shibacoinshic.org/tx/' + tx
                }
            }

            var globalData = {
                'balance': 0,
                'keys': undefined,
                'address': undefined,
                'rfee': getConfig()['fee'],
                'tx': {
                    'amount': 0,
                    'outputs': [],
                    'fee': 0
                },
                'resetTx': function() {
                    this.tx = {
                        'amount': 0,
                        'outputs': [],
                        'fee': 0
                    }
                },
                'clear': function() {
                    this.keys = {}
                    this.address = ''
                    this.balance = 0
                    this.resetTx()
                }
            }

            // --- Price Fetching + Total Value ---
            async function fetchFromCoinPaprika(currency = "USD") {
                try {
                    const response = await fetch('https://api.coinpaprika.com/v1/tickers/shic-shibacoin');
                    const data = await response.json();
                    console.log('CoinPaprika data:', data);
                    const price = Number(data?.quotes?.[currency.toUpperCase()]?.price);
                    if (!isNaN(price)) return price;
                    throw new Error("Invalid price from CoinPaprika.");
                } catch (err) {
                    console.warn("CoinPaprika failed:", err);
                    return null;
                }
            }

            async function fetchFromLiveCoinWatch(currency = "USD") {
                try {
                    const response = await fetch("https://api.livecoinwatch.com/coins/single", {
                        method: "POST",
                        headers: {
                            "content-type": "application/json",
                            "x-api-key": window.LCW_API_KEY || "9d7d070a-a798-4a0e-a8ec-e0391b5392c9",
                        },
                        body: JSON.stringify({
                            currency,
                            code: "SHIC",
                            meta: true,
                        }),
                    });

                    const data = await response.json();
                    console.log('LiveCoinWatch data:', data);
                    const price = Number(data?.rate);
                    if (!isNaN(price)) return price;
                    throw new Error("Invalid price from LiveCoinWatch.");
                } catch (err) {
                    console.error("LiveCoinWatch failed:", err);
                    return null;
                }
            }

            function fetchWalletTxHistory() {
                if (!globalData.address) return;

                const corsProxy = 'https://corsproxy.io/?';
                const apiUrl = `https://explorer.shibacoinshic.org/ext/getaddresstxs/${globalData.address}/0/50`;

                fetch(`${corsProxy}${encodeURIComponent(apiUrl)}`)
                    .then(response => response.json())
                    .then(data => {
                        const txBody = document.getElementById('tx-history-body');
                        txBody.innerHTML = '';

                        if (!data || !Array.isArray(data)) {
                            showMessage('No transaction data found.');
                            return;
                        }

                        data.forEach(tx => {
                            const row = document.createElement('tr');
                            const dateUTC = new Date(tx.timestamp * 1000).toUTCString();

                            const sent = parseFloat(tx.received || 0);
                            const received = parseFloat(tx.sent || 0);
                            const netAmount = received - sent;
                            const balance = parseFloat(tx.balance || 0);

                            const amountFormatted = `${netAmount > 0 ? '+' : netAmount < 0 ? '' : ''}${netAmount.toLocaleString(undefined, {
                                minimumFractionDigits: 2,
                                maximumFractionDigits: 8
                            })}`;
                            const balanceFormatted = balance.toLocaleString(undefined, {
                                minimumFractionDigits: 2,
                                maximumFractionDigits: 8
                            });

                            const amountColor = netAmount > 0 ? 'green' : netAmount < 0 ? 'red' : 'gray';

                            row.innerHTML = `
                                <td><a href="https://explorer.shibacoinshic.org/tx/${tx.txid}" target="_blank">${tx.txid}</a></td>
                                <td style="color:${amountColor}">${amountFormatted}</td>
                                <td>${balanceFormatted}</td>
                                <td>${dateUTC}</td>
                            `;

                            txBody.appendChild(row);
                        });
                    })
                    .catch(error => {
                        console.error('Error fetching transaction history:', error);
                        showMessage('Failed to load transaction history.');
                    });
            }

            function formatCurrency(value, currency = "USD") {
                const fractionDigits = currency === "BTC" ? 8 : 8;
                return new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency,
                    minimumFractionDigits: fractionDigits,
                    maximumFractionDigits: fractionDigits
                }).format(value);
            }

            async function updatePriceAndValue() {
                const spinner = document.getElementById('spinner');
                if (spinner) spinner.style.display = 'inline';

                try {
                    const currency = document.getElementById('currencySelect')?.value || 'USD';

                    // Try LiveCoinWatch first (has CORS support), fallback to CoinPaprika
                    let price = await fetchFromLiveCoinWatch(currency);
                    if (price === null) price = await fetchFromCoinPaprika(currency);
                    if (price === null) throw new Error("Both APIs failed.");

                    const balance = Number(amountFormat(globalData.balance));
                    if (isNaN(balance)) throw new Error("Invalid globalData.balance");

                    const formattedPrice = formatCurrency(price, currency);
                    const totalValue = formatCurrency(balance * price, currency);

                    if (document.getElementById('coinPrice')) document.getElementById('coinPrice').textContent = formattedPrice;
                    if (document.getElementById('totalValue')) document.getElementById('totalValue').textContent = totalValue;

                } catch (err) {
                    console.error('Error fetching price or calculating total value:', err);
                    if (document.getElementById('coinPrice')) document.getElementById('coinPrice').textContent = 'N/A';
                    if (document.getElementById('totalValue')) document.getElementById('totalValue').textContent = 'N/A';
                } finally {
                    if (spinner) spinner.style.display = 'none';
                }
            }

            // Messages
            var messages = initMessages()

            function initMessages() {
                return {
                    'settings': {
                        'typeSwitched': function (type) {
                            return getText('address-type-changed') + ' <b>' + type + '</b>'
                        },
                        'backendSwitched': function (url) {
                            return getText('backend-switched') + ' <b>' + url + '</b>'
                        },
                        'backendNotWorking': function (url) {
                            return '<b>' + url + '</b> ' + getText('backend-down')
                        }
                    },
                    'error': {
                        'bad-utxo': getText('bad-utxo'),
                        'balance-load-failed': getText('balance-load-failed'),
                        'not-enough-funds': getText('not-enough-funds'),
                        'not-valid-address': getText('not-valid-address'),
                        'not-valid-amount': getText('not-valid-amount'),
                        'not-valid-fee': getText('not-valid-fee'),
                        'bad-priv-key': getText('bad-priv-key'),

                if (days) {
                    var date = new Date();
                    date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                    expires = '; expires=' + date.toGMTString();
                } else {
                    expires = '';
                }
                document.cookie = encodeURIComponent(name) + '=' + encodeURIComponent(value) + expires + '; path=/';
            }

            // Read cookie
            function readCookie(name) {
                var nameEQ = encodeURIComponent(name) + '=';
                var ca = document.cookie.split(';');
                for (var i = 0; i < ca.length; i++) {
                    var c = ca[i];
                    while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                    if (c.indexOf(nameEQ) === 0) return decodeURIComponent(c.substring(nameEQ.length, c.length));
                }
                return null;
            }

            // Get address UTXO
            // Fetch a UTXO-set endpoint as raw text and quote "value":<digits>
            // fields as strings *before* JSON.parse touches them. Standard
            // JSON.parse (which is what jQuery's automatic JSON handling
            // uses) silently rounds any integer above
            // Number.MAX_SAFE_INTEGER - this backend does return UTXOs that
            // large (e.g. wallets holding tens/hundreds of millions of SHIC
            // in a single output), so parsing them as native JSON numbers
            // can corrupt the value by the time our code ever sees it. This
            // preserves every value digit-for-digit as a string, safe to
            // pass straight into BigInt(...).
            function fetchUnspent(address) {
                return Promise.resolve($.ajax({
                    'url': getBackend() + '/unspent/' + address,
                    'dataType': 'text'
                })).then(function(text) {
                    var safeText = text.replace(/"value":\s*(-?\d+)/g, '"value":"$1"')
                    return JSON.parse(safeText)
                })
            }

            function getUnspent(address, amount) {
                // Don't filter by amount - get all UTXOs and filter client-side
                return fetchUnspent(address).then(function(data) {
                    return data
                })
            }

            // Get confirmed balance from UTXOs (spendable balance)
            function getConfirmedBalance(address) {
                return fetchUnspent(address).then(function(data) {
                    if (data.error) {
                        return 0n;
                    }
                    // Sum up all UTXO values to get confirmed spendable balance
                    var total = 0n;
                    if (data.result && Array.isArray(data.result)) {
                        data.result.forEach(function(utxo) {
                            total += BigInt(utxo.value || 0);
                        });
                    }
                    return total;
                });
            }

            // Parse a decimal SHIC string/number into an exact BigInt of base
            // units, without any float math - Number-based multiplication
            // (amount * 1e8) silently loses precision above ~90M SHIC
            // (Number.MAX_SAFE_INTEGER / 1e8), which matters here since SHIC's
            // supply is far larger than that.
            function toBaseUnits(input) {
                var decimals = getConfig()['decimals']
                var str = String(input).trim()
                if (str === '' || isNaN(str)) return 0n
                var neg = str[0] === '-'
                if (neg) str = str.slice(1)
                var parts = str.split('.')
                var intPart = (parts[0] || '0').replace(/^0+(?=\d)/, '')
                var fracPart = (parts[1] || '').slice(0, decimals)
                fracPart = fracPart + '0'.repeat(decimals - fracPart.length)
                var result = BigInt(intPart + fracPart || '0')
                return neg ? -result : result
            }

            // Convert a BigInt/Number of base units into an exact decimal
            // string, the inverse of toBaseUnits - same reasoning: dividing
            // by 1e8 as a float loses precision for large balances.
            function fromBaseUnits(value) {
                var decimals = getConfig()['decimals']
                var big = typeof value === 'bigint' ? value : BigInt(Math.trunc(Number(value) || 0))
                var neg = big < 0n
                if (neg) big = -big
                var str = big.toString().padStart(decimals + 1, '0')
                var intPart = str.slice(0, str.length - decimals)
                var fracPart = str.slice(str.length - decimals).replace(/0+$/, '')
                var result = fracPart ? (intPart + '.' + fracPart) : intPart
                return neg ? '-' + result : result
            }

            // Convert between satoshi-style base units and a readable SHIC
            // amount. invert=false returns an exact decimal string (base
            // units -> SHIC); invert=true returns an exact BigInt (SHIC ->
            // base units), which is what TransactionBuilder.addOutput expects.
            function amountFormat(amount, invert = false) {
                if (!invert) {
                    return fromBaseUnits(amount)
                } else {
                    return toBaseUnits(amount)
                }
            }

            function sendTransaction() {
                var network = getConfig()['network'];
                var keys = globalData.keys;
                var decimals = getConfig()['decimals'];
                var outputs = globalData.tx.outputs;
                var amount = globalData.tx.amount;
                var address = globalData.address;
                var isMaxSend = globalData.tx.isMaxSend || false;

                var hashType = bitcoin.Transaction.SIGHASH_ALL;
                var scripts = [];

                var txb = new bitcoin.TransactionBuilder(network);
                txb.setVersion(2);

                $('#send-cancel').addClass('disabled');
                $('#send-confirm').addClass('disabled');
                $('#confirm-screen').addClass('d-none');
                $('#status-screen').removeClass('d-none');
                $('#send-title').text(messages.title['processing']);
                $('#status-screen .extra-info').empty();
                $('#status-screen span').html(messages.tx['generating']);
                $('#status-messages').empty(); // Clear previous status messages
                $('#send-progress-bar').css('width', '10%').attr('aria-valuenow', 10).text('10%');
                $('#status-messages').append('<li>Progress: 10% - Transaction builder initialized</li>');
                // $('#status-messages').append('<li>DEBUG: outputs=' + JSON.stringify(outputs) + ' amount=' + amount + ' isMaxSend=' + isMaxSend + '</li>');
                console.log('Progress: 10% - Transaction builder initialized');

                // Step 1: Add outputs (20%)
                try {
                    for (var i = 0, size = outputs.length; i < size; i++) {
                        // $('#status-messages').append('<li>DEBUG: adding output ' + i + ': ' + outputs[i].address + ' = ' + outputs[i].amount + '</li>');
                        txb.addOutput(outputs[i].address, outputs[i].amount);
                    }
                } catch (e) {
                    $('#status-messages').append('<li>ERROR adding outputs: ' + e + '</li>');
                    throw e;
                }
                $('#send-progress-bar').css('width', '20%').attr('aria-valuenow', 20).text('20%');
                $('#status-messages').append('<li>Progress: 20% - Outputs added</li>');
                console.log('Progress: 20% - Outputs added');

                // Step 2: Load UTXOs (40%)
                $('#status-screen span').html(messages.tx['loading-utxo']);
                getUnspent(address, amount).then(function (data) {
                    try {
					var size = data.result.length;
                    $('#send-progress-bar').css('width', '40%').attr('aria-valuenow', 40).text('40%');
                    $('#status-messages').append('<li>Progress: 40% - ' + size + ' UTXOs loaded</li>');
					console.log('Progress: 40% - UTXOs loaded');

                    // Get fee for filtering UTXOs - exact BigInt base units,
                    // not float math, since amount/needed can exceed
                    // Number.MAX_SAFE_INTEGER for large SHIC balances.
                    var fee = amountFormat($('#send-fee').val(), true);
                    var needed = amount + fee;

                    // Sort UTXOs by value descending (use largest first to minimize inputs)
                    var sortedUTXOs = data.result.slice().sort(function(a, b) { return b.value - a.value; });

                    var value = 0n;
                    var utxosUsed = 0;
                    for (var i = 0; i < sortedUTXOs.length; i++) {
                        var utxo = sortedUTXOs[i];
                        $('#status-messages').append('<li>Checking UTXO ' + i + ' : ' + utxo.value + ' (type: ' + typeof utxo.value + ')</li>');

                        // Stop if we have enough UTXOs (but not for MAX send - we need all UTXOs)
                        if (!isMaxSend && value >= needed && utxosUsed > 0) {
                            $('#status-messages').append('<li>Enough UTXOs, stopping at ' + utxosUsed + ' inputs</li>');
                            break;
                        }

                        var txid = utxo.txid;
                        var index = utxo.index;
                        var utxoVal = BigInt(utxo.value);
                        value += utxoVal;
                        utxosUsed++;
						// $('#status-messages').append('<li>DEBUG: value after UTXO ' + i + ': ' + value + '</li>');

                        var script = bitcoin.Buffer(utxo.script, 'hex');
                        var type = getScriptType(script);

                        if (type == 'bech32') {
                            var p2wpkh = getP2WPKHScript(keys.publicKey);
                            txb.addInput(txid, index, null, p2wpkh.output);
                        } else {
                            txb.addInput(txid, index);
                        }

                        scripts.push({
                            'script': script,
                            'type': type,
                            'value': data.result[i].value
                        });
                    }

                    // Step 3: Inputs added (60%)
                    $('#send-progress-bar').css('width', '60%').attr('aria-valuenow', 60).text('60%');
                    $('#status-messages').append('<li>Progress: 60% - Inputs added</li>');
                    console.log('Progress: 60% - Inputs added');

                    var fee = amountFormat($('#send-fee').val(), true);

                    console.log('DEBUG: isMaxSend=' + isMaxSend + ', value=' + value + ', amount=' + amount + ', fee=' + fee);

                    // For MAX send, we always have enough (we collected all UTXOs)
                    // For normal send, check if we have enough for amount + fee
                    if (isMaxSend || (value > amount + fee)) {
                        try {
                            // Only add change output if NOT max send and there's a big enough leftover
                            if (!isMaxSend) {
                                var change = value - amount - fee;
                                if (change > 0n) {
                                    txb.addOutput(address, change);
                                    $('#status-messages').append('<li>Change added: ' + change + '</li>');
                                }
                            }
                            $('#status-messages').append('<li>After change output, before 70%</li>');
                        } catch(e) {
                            $('#status-messages').append('<li>ERROR after change: ' + e + '</li>');
                            throw e;
                        }

                        // Step 4: Change output processed (70%)
                        $('#send-progress-bar').css('width', '70%').attr('aria-valuenow', 70).text('70%');
                        $('#status-messages').append('<li>Progress: 70% - Change output processed</li>');
                        console.log('Progress: 70% - Change output processed');

                        // Debug: check outputs before signing
                        // $('#status-messages').append('<li>DEBUG: Before sign - outs: ' + (txb.outs ? txb.outs.length : 'undefined') + ', tx.outs: ' + (txb.tx && txb.tx.outs ? txb.tx.outs.length : 'undefined') + '</li>');

                        for (var i = 0, size = scripts.length; i < size; i++) {
                            switch (scripts[i].type) {
                                case 'legacy':
                                    try {
                                        // $('#status-messages').append('<li>DEBUG: About to sign input ' + i + '</li>');
                                        txb.sign(i, keys);
                                        $('#status-messages').append('<li>Signed input ' + i + ' OK</li>');
                                    } catch (signError) {
                                        // $('#status-messages').append('<li>DEBUG: Sign ERROR: ' + signError + '</li>');
                                        throw signError;
                                    }
                                    break;
                                default:
                                    showMessage(messages.error['bad-utxo']);
                                    $('#send-progress-bar').css('width', '0%').attr('aria-valuenow', 0).text('0%');
                                    $('#status-messages').append('<li>Progress: Reset to 0% - Bad UTXO</li>');
                                    console.log('Progress: Reset to 0% - Bad UTXO');
                                    return;
                            }
                        }

                        // Step 5: Transaction signed (80%)
                        $('#send-progress-bar').css('width', '80%').attr('aria-valuenow', 80).text('80%');
                        $('#status-messages').append('<li>Progress: 80% - Transaction signed</li>');
                        console.log('Progress: 80% - Transaction signed');

                        var tx;
                        try {
                            tx = txb.build();
                            $('#status-messages').append('<li>Transaction built OK</li>');
                        } catch (buildError) {
                            $('#status-messages').append('<li>ERROR building tx: ' + buildError + '</li>');
                            throw buildError;
                        }

                        // Debug: log transaction details
                        console.log('Transaction hex:', tx.toHex());
                        console.log('Transaction details:', {
                            'version': tx.version,
                            'inputs': tx.ins.length,
                            'outputs': tx.outs.length,
                            'outputValues': tx.outs.map(o => o.value)
                        });

                        // Step 6: Broadcasting transaction (90%)
                        $('#send-progress-bar').css('width', '90%').attr('aria-valuenow', 90).text('90%');
                        $('#status-messages').append('<li>Progress: 90% - Broadcasting transaction</li>');
                        console.log('Progress: 90% - Broadcasting transaction');

                        transactionBroadcast(tx.toHex()).then(function (data) {
                            if (data.error == undefined) {
                                $('#status-screen span').html(`
                                    <a href="${blockExplorer.tx(data.result)}" target="_blank">
                                        ${data.result}
                                    </a>
                                `);
                                $('#send-title').text(messages.title['success']);
                                $('#send-progress-bar').css('width', '100%').attr('aria-valuenow', 100).text('100%');
                                $('#status-messages').append('<li>Progress: 100% - Transaction broadcasted successfully</li>');
                                console.log('Progress: 100% - Transaction broadcasted successfully');
                            } else {
                                $('#status-screen span').html(messages.error['broadcast-failed']);
                                $('#send-title').text(messages.title['failed']);
                                $('#status-screen .extra-info').html(`
                                    <div class="mt-3">
                                        <textarea class="form-control" readonly cols="30" rows="10">${data.error.message}</textarea>
                                    </div>
                                `);
                                $('#send-progress-bar').css('width', '0%').attr('aria-valuenow', 0).text('0%');
                                $('#status-messages').append('<li>Progress: Reset to 0% - Broadcast failed</li>');
                                console.log('Progress: Reset to 0% - Broadcast failed');
                            }
                            resetTxForm();
                            $('#send-cancel').addClass('d-none');
                            $('#send-confirm').addClass('d-none');
                            $('#send-close-footer').removeClass('d-none');
                            $('#send-close-footer').removeClass('disabled');
                        }).catch(function (error) {
                            $('#status-screen span').html(messages.error['broadcast-failed']);
                            $('#send-title').text(messages.title['failed']);
                            $('#status-screen .extra-info').html(`
                                <div class="mt-3">
                                    <textarea class="form-control" readonly cols="30" rows="10">${error.message || 'Unknown error'}</textarea>
                                </div>
                            `);
                            $('#send-progress-bar').css('width', '0%').attr('aria-valuenow', 0).text('0%');
                            $('#status-messages').append('<li>Progress: Reset to 0% - Broadcast error</li>');
                            console.log('Progress: Reset to 0% - Broadcast error');
                            resetTxForm();
                            $('#send-cancel').addClass('d-none');
                            $('#send-confirm').addClass('d-none');
                            $('#send-close-footer').removeClass('d-none');
                            $('#send-close-footer').removeClass('disabled');
                        });
                    } else {
                        showMessage(messages.error['not-enough-funds']);
                        $('#send-progress-bar').css('width', '0%').attr('aria-valuenow', 0).text('0%');
                        $('#status-messages').append('<li>Progress: Reset to 0% - Not enough funds</li>');
                        console.log('Progress: Reset to 0% - Not enough funds');
                    }
                    } catch (err) {
                        $('#status-messages').append('<li>ERROR IN THEN: ' + err + '</li>');
                        throw err;
                    }
                }).catch(function (error) {
                    showMessage(messages.error['bad-utxo']);
                    $('#send-progress-bar').css('width', '0%').attr('aria-valuenow', 0).text('0%');
                    $('#status-messages').append('<li>Progress: Reset to 0% - UTXO loading failed</li>');
                    $('#status-messages').append('<li>ERROR: ' + error + '</li>');
                });
            }

            // Close wallet
            function closeWallet() {
                $('#open-block').removeClass('d-none')
                $('#wallet-block').addClass('d-none')
                globalData.clear()
                setHomeTitle()
            }

            function getScriptType(script) {
                var type = undefined

                if (script[0] == bitcoin.opcodes.OP_0 &&
                    script[1] == 20) {
                    type = 'bech32'
                }

                if (script[0] == bitcoin.opcodes.OP_HASH160 &&
                    script[1] == 20) {
                    type = 'segwit'
                }

                if (script[0] == bitcoin.opcodes.OP_DUP &&
                    script[1] == bitcoin.opcodes.OP_HASH160 &&
                    script[2] == 20) {
                    type = 'legacy'
                }

                return type
            }

            function getP2SHScript(redeem) {
                return bitcoin.payments.p2sh({
                    'redeem': redeem,
                    'network': getConfig()['network']
                })
            }

            function getP2WPKHScript(pubkey) {
                return bitcoin.payments.p2wpkh({
                    'pubkey': pubkey,
                    'network': getConfig()['network']
                })
            }

            function getAddress(keys) {
                var network = getConfig()['network']
                var address = undefined

                if (getAddressType() == 'bech32') {
                    address = bitcoin.payments.p2wpkh({
                        'pubkey': keys.publicKey,
                        'network': network
                    }).address
                } else if (getAddressType() == 'segwit') {
                    address = bitcoin.payments.p2sh({
                        'redeem': getP2WPKHScript(keys.publicKey),
                        'network': network
                    }).address
                } else if (getAddressType() == 'legacy') {
                    address = bitcoin.payments.p2pkh({
                        'pubkey': keys.publicKey,
                        'network': getConfig()['network']
                    }).address
                }

                return address
            }

            function validateAddress(address) {
                var network = getConfig()['network']

                try {
                    bitcoin.address.fromBase58Check(address, network)
                    return true
                } catch (e) {
                    try {
                        bitcoin.address.fromBech32(address, network)
                        return true
                    } catch (e) {
                        return false
                    }
                }
            }

            // Create new wallet
            $('#footer-create').click(function() {
                var keys = bitcoin.ECPair.makeRandom({'network': getConfig()['network']})
                var address = getAddress(keys)

                if (address != undefined) {
                    $('#create-keys-address input').val(address)
                    $('#create-keys-pubkey input').val(keys.publicKey.toString('hex'))
                    $('#create-keys-privkey input').val(keys.toWIF())
                }
            })

            // Broadcast raw transaction
            $('#footer-broadcast').click(function(){
                var rawtx = $('#transaction-broadcast-raw')
                transactionBroadcast(rawtx.val()).then(function(data) {
                    if (data.error == undefined) {
                        showMessage(`
                            ${messages.tx['success']}<a href="` + blockExplorer.tx(data.result) + `" target="_blank">` + data.result + `</a>
                        `)
                    } else {
                        showMessage(messages.error['broadcast-failed'])
                    }
                })
                rawtx.val('')
            })

            // Reset sending form
            function resetTxForm() {
                $('.send-additional-output').remove();
                $('#wallet-send input').val('');
                $('#send-fee').val('0.1');
                $('#send-progress-bar').css('width', '0%').attr('aria-valuenow', 0).text('0%');
                globalData.resetTx();
            }

            function initWallet() {
                // Open only if key is valid
                if (globalData.keys != undefined) {
                    openWallet(globalData.keys)
                }
            }

            // All starts here
            $(document).ready(function() {
                initLang()

                $('#wallet-version').text(walletVersion)
                $('#wallet-backend input').val(getBackend())
                $('#address-type-select select').val(getAddressType());

                displayNetworks()
                routePage()

                $('.tab-link').click(function(e) {
                    var tabFamily = $(this).data('tab-family')
                    var tabName = $(this).data('tab-name')

                    $('#' + tabFamily + ' .tab-item').addClass('d-none')
                    $('#' + tabFamily + ' .card-header .card-header-tabs .nav-link').removeClass('active')

                    $('#' + tabFamily + ' [data-tab=' + tabName + ']').removeClass('d-none')
                    $(this).addClass('active')

                    // Reset send form when switching to send tab
                    if (tabName === 'wallet-send') {
                        resetTxForm()
                    }

                    e.preventDefault()
                })

                $(window).on('hashchange', routePage)
                if (window.location.hash) {
                    $(window).trigger('hashchange')
                }

                // Open wallet by WIF key
                $('#open-key-form').submit(function(e){
                    var wif = $('#passphrase').val().trim()
                    var wifLength = wif.length
                    if ([51, 52].includes(wifLength)) {
                        try {
                            globalData.keys = bitcoin.ECPair.fromWIF(wif, getConfig()['network'])
                        } catch(e) {
                            showMessage(messages.error['bad-priv-key'])
                        }

                        $('#passphrase').val('')
                        initWallet()
                    } else {
                        showMessage(messages.error['bad-priv-key'])
                    }

                    e.preventDefault()
                })

                // Open wallet using email and password
                $("#open-regular-form").submit(function(e) {
                    var email = $("#open-email").val().toLowerCase()
                    var pass = $("#open-password").val()
                    var passConfirm = $("#open-password-confirm").val()
                    if (email.match(/[\s\w\d]+@[\s\w\d]+/g)) {
                        if (pass.length >= 10){
                            if (pass == passConfirm) {
                                var pass = pass
                                var s = email
                                s += '|' + pass + '|'
                                s += s.length + '|!@' + ((pass.length * 7) + email.length) * 7
                                var regchars = (pass.match(/[a-z]+/g)) ? pass.match(/[a-z]+/g).length : 1
                                var regupchars = (pass.match(/[A-Z]+/g)) ? pass.match(/[A-Z]+/g).length : 1
                                var regnums = (pass.match(/[0-9]+/g)) ? pass.match(/[0-9]+/g).length : 1
                                s += ((regnums + regchars) + regupchars) * pass.length + '3571'
                                s += (s + '' + s)

                                for (i = 0; i <= 51; i++){
                                    s = sha256.update(s).hex()
                                }

                                $('#open-email').val('')
                                $('#open-password').val('')
                                $('#open-password-confirm').val('')

                                globalData.keys = bitcoin.ECPair.fromPrivateKey(
                                    bitcoin.Buffer.from(s, 'hex'),
                                    {'network': getConfig()['network']}
                                )
                                openWallet(globalData.keys)
                            } else {
                                showMessage(messages.error['pass-not-match'])
                            }
                        } else {
                            showMessage(messages.error['pass-too-short'])
                        }
                    } else {
                        showMessage(messages.error['bad-email'])
                    }

                    e.preventDefault()
                })

                // Check wallet balance on balance label click
                $('.wallet-balance').click(function(e){
                    walletBalance()
                    e.preventDefault()
                })

                // Toggle private key visibility
                $('.toggle-priv-key').click(function(){
                    if ($(this).text() == getText('show')) {
                        $(this).parent().parent().find('.keys-privkey').attr('type', 'text')
                        $(this).text(getText('hide'))
                    } else {
                        $(this).parent().parent().find('.keys-privkey').attr('type', 'password')
                        $(this).text(getText('show'))
                    }
                })
                
                $('#send-tx').click(function() {
                    var error = false
                    var feeInput = ($('#send-fee').val() != '') ? $('#send-fee').val() : globalData.rfee
                    var txFee = Number(feeInput)

                    if ((isNaN(txFee)) || txFee <= 0) {
                        showMessage(messages.error['not-valid-fee'])
                        error = true
                    } else {
                        if (txFee < getConfig()['fee']) {
                            showMessage(messages.error['small-fee'])
                            error = true
                        }
                    }

                    // Sum outputs as exact base-unit BigInts - Number math
                    // here would silently lose precision above ~90M SHIC.
                    var totalBase = 0n
                    $.each($('#send-outputs .send-outputs-item'), function(key, item) {
                        var address = $('[name="send-address"]', item).val().trim()
                        var amount = $('[name="send-amount"]', item).val()

                        if ((amount === '') || isNaN(amount) || Number(amount) <= 0) {
                            showMessage(messages.error['not-valid-amount'])
                            error = true
                        }

                        if (validateAddress(address) == false) {
                            showMessage(messages.error['not-valid-address'])
                            error = true
                        }

                        totalBase += amountFormat(amount, true)
                    })

                    var feeBase = amountFormat(feeInput, true)
                    totalBase += feeBase

                    if (!error) {
                        var balanceBase = BigInt(globalData.balance || 0)

                        if (totalBase <= balanceBase) {
                            // Pass the original amount (without fee) to showConfirmation
                            var sendAmount = amountFormat(totalBase - feeBase)
                            showConfirmation(sendAmount)
                        } else {
                            showMessage(messages.error['not-enough-funds'])
                        }
                    }
                })

                // Confirm transaction sending (are you sure?)
                $('#send-confirm').click(function(e){
                    sendTransaction()
                    e.preventDefault()
                })

                // Add transaction output
                $('#add-output').click(function(e){
                    $('#send-outputs').append(`
                        <div class="send-additional-output send-outputs-item input-group mb-2">
                            <input name="send-address" class="form-control" placeholder="${getText('enter-address')}" type="text">
                            <input name="send-amount" class="form-control" placeholder="${getText('amount')}" type="text">
                            <div class="input-group-append">
                                <button class="btn btn-outline-danger remove-additional-output" type="submit">-</button>
                            </div>
                        </div>
                    `)
                    $('.remove-additional-output').click(function(e){
                        $(this).closest('.send-additional-output').remove()
                        e.preventDefault()
                    })
                    e.preventDefault()
                })

                // Define function first
                function getMaxSendAmount(utxos, feeSatoshis) {
                    const total = utxos.reduce((sum, u) => sum + BigInt(u.value), 0n);
                    const maxSend = total - BigInt(feeSatoshis);
                    return maxSend > 0n ? maxSend : 0n;
                }

                // Bind max button click AFTER function is defined
                $('#send-max').click(function () {
                    getUnspent(globalData.address, 0).then(function (data) {
                        if (!data.error) {
                            const utxos = data.result;
                            // Fee is 0.1 SHIC = 10,000,000 satoshis
                            const feeSatoshis = 10000000;
                            const maxAmount = getMaxSendAmount(utxos, feeSatoshis); // BigInt base units

                            // Exact decimal string - the input field's text is
                            // re-parsed back through amountFormat() when the
                            // send button is clicked, so it must round-trip
                            // without losing precision.
                            const roundedAmount = amountFormat(maxAmount);
                            $('[name="send-amount"]').val(roundedAmount);
                            $('#send-fee').val('0.1');

                            globalData.tx.isMaxSend = true;
                            globalData.tx.amount = maxAmount;
                            globalData.tx.outputs = [{
                                address: globalData.address,
                                amount: maxAmount
                            }];
                        }
                    });
                });

                // Set wallet recommended fee
                estimateFee().then(function(data) {
                    if (data.error == undefined) {
                        globalData.rfee = amountFormat(data.result.feerate)
                    } else {
                        globalData.rfee = getConfig()['fee']
                    }
                })

                // Reset send form
                $('#send-reset').click(function(e) {
                    resetTxForm()
                    e.preventDefault()
                })

                // Reset send form
                $('#send-qr').click(function(e) {
                    showScanModal()
                    e.preventDefault()
                })

                // Footer button which close wallet
                $('#footer-close').click(function(e) {
                    closeWallet()
                    e.preventDefault()
                })

                // Change address type
                $('#address-type-select select').on('change', function() {
                    switchAddressType($(this).val())
                    showMessage(messages.settings.typeSwitched($(this).val()))
                    initWallet()
                })

                // Change wallet backend
                $('#wallet-backend button').click(function(e) {
                    switchBackend($('#wallet-backend input').val())
                })

                // Change wallet language
                $('#wallet-language-select select').on('change', function() {
                    setCookie('language', $('#wallet-language-select select').val(), 60)
                    initLang()
                    initWallet()
                })

                $('#scan-modal').on('hide.bs.modal', function (e) {
                    stopStream()
                })

                $('#send-modal').on('hide.bs.modal', function (e) {
                    $('#send-progress-bar').css('width', '0%').attr('aria-valuenow', 0).text('0%');
                })
            })
        </script>
        
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                // Only run wallet operations if wallet is open
                if (globalData.keys !== undefined && globalData.address !== undefined) {
                    walletBalance();
                    setInterval(updatePriceAndValue, 30000);
                } else {
                    // Still run price update even without wallet, but only for display
                    updatePriceAndValue();
                    setInterval(updatePriceAndValue, 30000);
                }

                const currencySelect = document.getElementById('currencySelect');
                if (currencySelect) {
                    currencySelect.addEventListener('change', updatePriceAndValue);
                }

                const historyTab = document.querySelector('[data-tab="wallet-history"]');
                if (historyTab) {
                    historyTab.addEventListener('click', () => {
                        fetchWalletTxHistory();
                    });
                }
            });
        </script>
    </body>
</html>
